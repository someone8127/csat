<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSAT English Assistant | 수능·모의고사 영어 학습</title>
  <meta name="description" content="수능 및 평가원·교육청 모의고사 영어 리딩을 학년별, 유형별로 풀어 보는 비영리 학습 사이트" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-10 sm:py-16">
    <section class="text-center max-w-2xl mx-auto">
      <p class="text-sm font-semibold text-brand-600">수능 · 평가원 · 교육청 모의고사</p>
      <h1 class="mt-2 text-3xl sm:text-4xl font-bold tracking-tight">CSAT English Assistant</h1>
      <p class="mt-3 text-slate-600 leading-relaxed">학년별, 유형별로 영어 리딩 문제를 풀고<br class="sm:hidden" /> 해설과 번역까지 바로 확인해 보세요.</p>
    </section>

    <!-- 클릭하면 이동하는 카드 4개 -->
    <section class="mt-10 sm:mt-14 grid gap-4 sm:grid-cols-2 lg:grid-cols-4" aria-label="학습 메뉴">
      <a href="first.html" class="group block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-brand-500 hover:shadow-md">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">GRADE 1</span>
        <p class="mt-4 text-3xl font-bold">고1</p>
        <p class="mt-1 text-sm text-slate-500">고1 모의고사 풀기</p>
        <p class="mt-5 flex items-center justify-between text-xs text-slate-400"><span data-count="고1"></span><span class="text-brand-600 font-semibold transition group-hover:translate-x-0.5">바로 풀기 →</span></p>
      </a>

      <a href="second.html" class="group block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-brand-500 hover:shadow-md">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-100 text-sky-700">GRADE 2</span>
        <p class="mt-4 text-3xl font-bold">고2</p>
        <p class="mt-1 text-sm text-slate-500">고2 모의고사 풀기</p>
        <p class="mt-5 flex items-center justify-between text-xs text-slate-400"><span data-count="고2"></span><span class="text-brand-600 font-semibold transition group-hover:translate-x-0.5">바로 풀기 →</span></p>
      </a>

      <a href="third.html" class="group block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-brand-500 hover:shadow-md">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-violet-100 text-violet-700">GRADE 3</span>
        <p class="mt-4 text-3xl font-bold">고3</p>
        <p class="mt-1 text-sm text-slate-500">고3 모의고사 풀기</p>
        <p class="mt-5 flex items-center justify-between text-xs text-slate-400"><span data-count="고3"></span><span class="text-brand-600 font-semibold transition group-hover:translate-x-0.5">바로 풀기 →</span></p>
      </a>

      <a href="types.html" class="group block rounded-2xl border border-brand-600 bg-brand-600 p-6 text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-brand-700 hover:shadow-md">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/20 text-white">BY TYPE</span>
        <p class="mt-4 text-3xl font-bold">유형별</p>
        <p class="mt-1 text-sm text-brand-100">유형을 골라 집중 연습</p>
        <p class="mt-5 flex items-center justify-between text-xs text-brand-100"><span>9개 유형</span><span class="font-semibold transition group-hover:translate-x-0.5">유형 보기 →</span></p>
      </a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="data/bank.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // 학년 카드의 문항 수 표시
    (function () {
      var bank = window.QUESTION_BANK || [];
      document.querySelectorAll("[data-count]").forEach(function (el) {
        var n = bank.filter(function (q) { return q.grade === el.dataset.count; }).length;
        el.textContent = n ? n + "문항" : "준비 중";
      });
    })();
  </script>
</body>
</html>
